AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SpecterKeys — Honey Token Deception System (Infrastructure Stack)
  Deploys the full detection pipeline: CloudTrail → CloudWatch Logs →
  Metric Filters → Alarms → SNS → Lambda auto-responder.

Parameters:
  AlertEmail:
    Type: String
    Description: Security team email for honey key alerts
    Default: security-team@company.com

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  LogRetentionDays:
    Type: Number
    Default: 90
    Description: CloudWatch Logs retention period in days

Resources:

  # ── S3 — CloudTrail Log Bucket ───────────────────────────────────────────
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "specterkeys-cloudtrail-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldLogs
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # ── CloudWatch Log Group ─────────────────────────────────────────────────
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /specterkeys/cloudtrail
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  # ── CloudTrail IAM Role ──────────────────────────────────────────────────
  CloudTrailRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SpecterKeys-CloudTrailRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CloudTrailLogGroup.Arn

  # ── CloudTrail ───────────────────────────────────────────────────────────
  SpecterKeysTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: SpecterKeysTrail
      IsLogging: true
      S3BucketName: !Ref CloudTrailBucket
      IncludeGlobalServiceEvents: true     # Captures global IAM API calls
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailRole.Arn
      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  # ── SNS Alert Topic ──────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecterKeysAlerts
      DisplayName: "SPECTERKEYS ALERT — Honey Token Triggered"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic

  # ── Metric Filter — Catches any honey user API call ──────────────────────
  HoneyKeyMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CloudTrailLogGroup
      FilterName: SpecterKeys-AnyHoneyUserCall
      # Match both the direct IAM username and the assumed-role/session issuer
      # name so events where userName is nested are still caught.
      FilterPattern: '{ ($.userIdentity.userName = "svc-legacy-backup-*") || ($.userIdentity.sessionContext.sessionIssuer.userName = "svc-legacy-backup-*") }'
      MetricTransformations:
        - MetricName: HoneyKeyAPICall
          MetricNamespace: SpecterKeys/DeceptionSystem
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  # ── CloudWatch Alarm ─────────────────────────────────────────────────────
  HoneyKeyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SpecterKeys-HoneyTokenTriggered
      AlarmDescription: >
        CRITICAL: A SpecterKeys honey token has been used.
        This credential has ZERO legitimate use — any invocation is a
        confirmed insider threat or external breach. Initiate IR playbook.
      MetricName: HoneyKeyAPICall
      Namespace: SpecterKeys/DeceptionSystem
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  # ── Lambda Auto-Responder ────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SpecterKeys-LambdaRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SpecterKeysResponderPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccessKey
                  - iam:ListAccessKeys
                  - iam:ListUsers
                  - iam:TagUser
                  - cloudwatch:PutMetricData
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - sns:Publish
                  - secretsmanager:ListSecrets
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: "*"

  AutoResponderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: SpecterKeys-AutoResponder
      Description: >
        On honey key trigger: disables the access key, tags the IAM user
        with the incident timestamp, and logs a structured IR event.
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          ALERT_TOPIC_ARN: !Ref AlertTopic
          ENVIRONMENT: !Ref EnvironmentName
          HONEY_USER_PREFIX: svc-legacy-backup
          SECRET_PREFIX: specterkeys
      Code:
        ZipFile: |
          """SpecterKeys Auto-Responder Lambda — triggered by SNS alarm.

          The stack-level alarm name does not embed an access key ID, so the
          responder cannot rely on parsing it. Instead it enumerates IAM users
          that match the honey-user prefix (paginated) and disables their
          access keys — any honey-key usage is malicious by definition — then
          marks the matching Secrets Manager registry entry as TRIGGERED.
          """
          import json, os, logging
          import boto3
          from datetime import datetime, timezone

          log = logging.getLogger()
          log.setLevel(logging.INFO)
          iam = boto3.client("iam")
          sm  = boto3.client("secretsmanager")

          HONEY_USER_PREFIX = os.environ.get("HONEY_USER_PREFIX", "svc-legacy-backup")
          SECRET_PREFIX     = os.environ.get("SECRET_PREFIX", "specterkeys")


          def extract_key_id(alarm_name):
              for token in alarm_name.split("-"):
                  if token.startswith("AKIA"):
                      return token
              return None


          def iter_honey_users():
              paginator = iam.get_paginator("list_users")
              for page in paginator.paginate():
                  for user in page["Users"]:
                      if user["UserName"].startswith(HONEY_USER_PREFIX):
                          yield user["UserName"]


          def disable_honey_keys(target_key_id, ts):
              disabled = []
              for username in iter_honey_users():
                  for k in iam.list_access_keys(UserName=username)["AccessKeyMetadata"]:
                      key_id = k["AccessKeyId"]
                      if target_key_id and key_id != target_key_id:
                          continue
                      if k.get("Status") != "Active":
                          continue
                      try:
                          iam.update_access_key(
                              UserName=username, AccessKeyId=key_id, Status="Inactive"
                          )
                          iam.tag_user(
                              UserName=username,
                              Tags=[{"Key": "TriggeredAt", "Value": ts}],
                          )
                          disabled.append({"username": username, "key_id": key_id})
                          log.info(f"Disabled key {key_id} (user {username})")
                          mark_secret_triggered(key_id, ts)
                      except Exception as e:
                          log.error(f"Key disable error for {key_id}: {e}")
              return disabled


          def mark_secret_triggered(key_id, ts):
              secret_id = f"{SECRET_PREFIX}/{key_id}"
              try:
                  current = sm.get_secret_value(SecretId=secret_id)
                  data = json.loads(current["SecretString"])
                  data["status"] = "TRIGGERED"
                  data["triggered_at"] = ts
                  sm.put_secret_value(SecretId=secret_id, SecretString=json.dumps(data))
              except Exception as e:
                  log.warning(f"Could not update registry for {key_id}: {e}")


          def lambda_handler(event, context):
              log.info(f"SpecterKeys event: {json.dumps(event)}")
              for record in event.get("Records", []):
                  message = json.loads(record["Sns"]["Message"])
                  alarm   = message.get("AlarmName", "")
                  ts      = datetime.now(timezone.utc).isoformat()
                  target_key_id = extract_key_id(alarm)
                  disabled = disable_honey_keys(target_key_id, ts)
                  incident = {
                      "timestamp":     ts,
                      "alarm":         alarm,
                      "target_key_id": target_key_id,
                      "disabled_keys": disabled,
                      "state":         message.get("NewStateValue"),
                      "reason":        message.get("NewStateReason"),
                      "severity":      "CRITICAL",
                  }
                  log.info(f"SPECTERKEYS INCIDENT: {json.dumps(incident)}")
              return {"statusCode": 200}

      Tags:
        - Key: SpecterKeys
          Value: Infrastructure

  LambdaSNSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AutoResponderLambda
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlertTopic

  # Subscribe the Lambda to the topic via a standalone resource. Doing it here
  # (rather than inline on AlertTopic) breaks the circular dependency between
  # the topic and the function it invokes.
  LambdaSNSSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: LambdaSNSPermission
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: lambda
      Endpoint: !GetAtt AutoResponderLambda.Arn

  # ── CloudWatch Dashboard ─────────────────────────────────────────────────
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: SpecterKeys-DeceptionSystem
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "alarm",
              "properties": {
                "title": "Honey Key Alarm Status",
                "alarms": ["${HoneyKeyAlarm}"]
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Honey Key API Calls (24h)",
                "metrics": [["SpecterKeys/DeceptionSystem","HoneyKeyAPICall"]],
                "period": 3600,
                "stat": "Sum",
                "view": "timeSeries"
              }
            }
          ]
        }

Outputs:
  AlertTopicArn:
    Description: SNS topic ARN for honey key alerts
    Value: !Ref AlertTopic
    Export:
      Name: SpecterKeys-AlertTopicArn

  CloudTrailLogGroupName:
    Description: CloudWatch log group receiving CloudTrail events
    Value: !Ref CloudTrailLogGroup
    Export:
      Name: SpecterKeys-LogGroupName

  AutoResponderArn:
    Description: Auto-responder Lambda function ARN
    Value: !GetAtt AutoResponderLambda.Arn

  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=SpecterKeys-DeceptionSystem"
