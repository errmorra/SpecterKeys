name: SpecterKeys CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 src/ tests/

      - name: Security scan (bandit)
        run: bandit -r src/ -ll

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing

  validate-cfn:
    name: Validate CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: pip install cfn-lint

      # cfn-lint validates the template offline — no AWS account or
      # credentials required — and catches more issues (e.g. circular
      # dependencies) than `aws cloudformation validate-template`.
      - name: Validate CloudFormation template
        run: cfn-lint infra/cloudformation.yaml
